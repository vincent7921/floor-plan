/* =========================================================
   門（牆上的洞）
========================================================= */

/* 門寬 cm → 像素（獨立函式，不影響窗戶） */
function doorPixelLength(widthCm) {
  return widthCm * house.scale;
}


/* 依牆的方向，算出門的矩形（白色遮牆用） */
function doorRect(horizontal, wallX, wallY, centerPx, lengthPx) {

  const thick = WALL_THICKNESS + 4;

  if (horizontal) {
    return {
      x: wallX + centerPx - lengthPx / 2,
      y: wallY - thick / 2,
      width: lengthPx,
      height: thick
    };
  }

  return {
    x: wallX - thick / 2,
    y: wallY + centerPx - lengthPx / 2,
    width: thick,
    height: lengthPx
  };

}


/* 門預覽 */
function updateDoorPreview(evt) {

  if (mode !== "door") return;

  windowLayer.querySelectorAll(".dpreview").forEach(el => el.remove());
  previewDoor = null;

  const p = svgPoint(evt);

  /* 直接重複使用窗戶的牆壁判斷 */
  const wall = findNearestWall(p.x, p.y);

  if (!wall) return;

  const widthCm = Number(document.getElementById("doorW").value);

  if (!widthCm || widthCm <= 0) return;

  const horizontal = wall.wall === "top" || wall.wall === "bottom";

  const wallLen = horizontal
    ? Math.abs(wall.x2 - wall.x1)
    : Math.abs(wall.y2 - wall.y1);

  const lengthPx = doorPixelLength(widthCm);

  /* 門中心 = 滑鼠位置（只避免門超出牆的兩端） */
  let centerPx = horizontal
    ? p.x - wall.x1
    : p.y - wall.y1;

  if (wallLen >= lengthPx) {
    centerPx = clamp(centerPx, lengthPx / 2, wallLen - lengthPx / 2);
  } else {
    centerPx = wallLen / 2;
  }

  const rect = doorRect(horizontal, wall.x1, wall.y1, centerPx, lengthPx);

  previewDoor = {
    wall,
    widthCm,
    center: centerPx / house.scale
  };

  windowLayer.appendChild(
    createSVG("rect", { ...rect, class: "door-preview dpreview" })
  );

}


/* 點擊放置門（不會自動結束模式） */
function placeDoor() {

  if (mode !== "door" || !previewDoor) return;

  const d = previewDoor;

  const newDoor = {
    id: uid("door"),
    widthCm: d.widthCm,
    parentType: d.wall.type,
    parentId: d.wall.id,
    wall: d.wall.wall,
    center: d.center        /* cm，相對於牆起點 */
  };

  doors.push(newDoor);

  selectedDoorId = newDoor.id;
  selectedRoomId = null;
  selectedWindowId = null;

  previewDoor = null;

  render();

  showStatus("門已建立（可繼續點擊放置）");

}


/* 畫出一個門：白色矩形把牆遮住 */
function renderDoor(door) {

  const wall = getAllWalls().find(w =>
    w.id === door.parentId && w.wall === door.wall
  );

  if (!wall) return;

  const horizontal = door.wall === "top" || door.wall === "bottom";

  const wallLen = horizontal
    ? Math.abs(wall.x2 - wall.x1)
    : Math.abs(wall.y2 - wall.y1);

  let lengthPx = Math.min(doorPixelLength(door.widthCm), wallLen);

  let centerPx = clamp(
    door.center * house.scale,
    lengthPx / 2,
    Math.max(lengthPx / 2, wallLen - lengthPx / 2)
  );

  const rect = doorRect(horizontal, wall.x1, wall.y1, centerPx, lengthPx);

  const selected = selectedDoorId === door.id;

  const el = createSVG("rect", {
    ...rect,
    class: "door" + (selected ? " selected" : "")
  });

  el.addEventListener("click", evt => {

    if (mode !== "select") return;

    evt.stopPropagation();

    selectedDoorId = door.id;
    selectedRoomId = null;
    selectedWindowId = null;

    render();

  });

  windowLayer.appendChild(el);

}


/* 門清單 */
function renderDoorList() {

  doorList.innerHTML = "";

  if (doors.length === 0) {
    doorList.innerHTML = '<div class="help">尚未建立門</div>';
    return;
  }

  doors.forEach((door, index) => {

    const div = document.createElement("div");

    div.className = "window-item";

    if (selectedDoorId === door.id) {
      div.style.borderColor = "#8a5a2b";
    }

    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <strong>門 ${index + 1}</strong>
        <button type="button" class="deleteBtn" style="padding:4px 8px; font-size:12px;">刪除</button>
      </div>
      <div style="color:#666; margin-top:5px;">
        寬度 ${Math.round(door.widthCm)} cm
      </div>
    `;

    div.addEventListener("click", () => {

      selectedDoorId = door.id;
      selectedRoomId = null;
      selectedWindowId = null;

      mode = "select";
      updateModeButtons();

      render();

    });

    div.querySelector(".deleteBtn").addEventListener("click", evt => {

      evt.stopPropagation();

      removeDoor(door.id);

    });

    doorList.appendChild(div);

  });

}


function removeDoor(id) {

  doors = doors.filter(d => d.id !== id);

  if (selectedDoorId === id) {
    selectedDoorId = null;
  }

  render();

}


/* 門模式開關 */
function enterDoorMode() {

  if (mode === "door") {

    mode = "select";
    updateModeButtons();
    showStatus("已退出繪製門模式");
    return;

  }

  const width = Number(document.getElementById("doorW").value);

  if (!width || width <= 0) {
    alert("請先設定門寬");
    return;
  }

  mode = "door";

  selectedRoomId = null;
  selectedWindowId = null;
  selectedDoorId = null;

  render();
  updateModeButtons();

  showStatus("請將滑鼠移到牆壁附近，點一下開門");

}


document.getElementById("doorMode").addEventListener("click", enterDoorMode);
document.getElementById("doorModeTop").addEventListener("click", enterDoorMode);



/* 門相關的畫布事件（獨立監聽，不動窗戶的） */

svg.addEventListener("pointermove", evt => {
  if (mode === "door" && !dragData && !resizeData) {
    updateDoorPreview(evt);
  }
});

svg.addEventListener("pointerleave", () => {
  if (mode === "door") {
    windowLayer.querySelectorAll(".dpreview").forEach(el => el.remove());
    previewDoor = null;
  }
});

svg.addEventListener("pointerdown", evt => {
  if (mode === "door") evt.preventDefault();
});

svg.addEventListener("click", evt => {

  if (mode === "door") {
    placeDoor();
    return;
  }

  /* 點空白處取消門的選取 */
  if (evt.target === svg && selectedDoorId) {
    selectedDoorId = null;
    render();
  }

});



/* =========================================================
   工具列／圖層 UI
========================================================= */

function updateLayerInfo() {

  document.getElementById("houseInfo").innerHTML = `
    <div class="room-name">房屋外框</div>
    <div class="room-size">${Math.round(house.w)} × ${Math.round(house.h)} cm</div>
  `;

  document.getElementById("roomCount").textContent = `(${rooms.length})`;
  document.getElementById("windowCount").textContent = `(${windows.length})`;
  document.getElementById("doorCount").textContent = `(${doors.length})`;

  syncLayerSelection();

}


/* 點房屋圖層 → 展開房屋外框設定 */
document.getElementById("houseInfo").addEventListener("click", () => {
  mode = "select";
  activePanel = "house";
  updateModeButtons();
});


/* 房屋外框／新增房間：點一下展開，再點一下收起 */
function togglePanel(name) {

  if (mode !== "select") {
    mode = "select";
  }

  activePanel = (activePanel === name) ? null : name;

  updateModeButtons();

}

document.getElementById("toolHouse")
  .addEventListener("click", () => togglePanel("house"));

document.getElementById("toolRoom")
  .addEventListener("click", () => togglePanel("room"));


/* 新增房間後清空名稱，方便接著輸入下一間 */
document.getElementById("addRoom").addEventListener("click", () => {
  document.getElementById("roomName").value = "";
});



/* =========================================================
   圖層連動選取
========================================================= */

let _lastLayerSel = "";

function markSelected(listEl, items, selId) {

  Array.from(listEl.children).forEach((el, i) => {
    el.classList.toggle(
      "selected",
      !!(items[i] && items[i].id === selId)
    );
  });

}

function syncLayerSelection() {

  markSelected(windowList, windows, selectedWindowId);
  markSelected(doorList, doors, selectedDoorId);

  const key = [selectedRoomId, selectedWindowId, selectedDoorId].join("|");

  if (key === _lastLayerSel) return;

  _lastLayerSel = key;

  const el = document.querySelector(
    "#roomList .selected, #windowList .selected, #doorList .selected"
  );

  if (!el) return;

  /* 該圖層群組若被折疊，自動展開 */
  el.closest(".section").classList.remove("collapsed");

  /* 只捲動左側欄，讓選到的圖層進入視野 */
  const sb = document.querySelector(".sidebar");
  const r = el.getBoundingClientRect();
  const sr = sb.getBoundingClientRect();

  if (r.top < sr.top) {
    sb.scrollTop -= (sr.top - r.top) + 8;
  } else if (r.bottom > sr.bottom) {
    sb.scrollTop += (r.bottom - sr.bottom) + 8;
  }

}


/* =========================================================
   畫布縮放
========================================================= */

let zoom = 1;

const ZOOM_MIN = 0.4;
const ZOOM_MAX = 4;

function applyZoom() {

  const box = document.querySelector(".canvas-box");

  const w = SVG_W * zoom;
  const h = SVG_H * zoom;

  svg.style.width = w + "px";
  svg.style.height = h + "px";

  box.style.width = (w + 2) + "px";
  box.style.height = (h + 2) + "px";
  box.style.minWidth = (w + 2) + "px";
  box.style.minHeight = (h + 2) + "px";
  box.style.backgroundSize = (20 * zoom) + "px " + (20 * zoom) + "px";

  document.getElementById("zoomLabel").textContent =
    Math.round(zoom * 100) + "%";

}

/* 以指定的螢幕座標為中心縮放（預設為可視區中心） */
function setZoom(newZoom, clientX, clientY) {

  const wrap = document.querySelector(".canvas-wrap");
  const rect = wrap.getBoundingClientRect();

  const ax = clientX === undefined ? rect.width / 2 : clientX - rect.left;
  const ay = clientY === undefined ? rect.height / 2 : clientY - rect.top;

  const old = zoom;

  zoom = clamp(newZoom, ZOOM_MIN, ZOOM_MAX);

  if (zoom === old) return;

  const contentX = (wrap.scrollLeft + ax) / old;
  const contentY = (wrap.scrollTop + ay) / old;

  applyZoom();

  wrap.scrollLeft = contentX * zoom - ax;
  wrap.scrollTop = contentY * zoom - ay;

}

document.getElementById("zoomIn")
  .addEventListener("click", () => setZoom(zoom * 1.2));

document.getElementById("zoomOut")
  .addEventListener("click", () => setZoom(zoom / 1.2));

document.getElementById("zoomReset")
  .addEventListener("click", () => setZoom(1));

/* Ctrl + 滾輪縮放（以滑鼠位置為中心） */
document.querySelector(".canvas-wrap").addEventListener(
  "wheel",
  evt => {
    if (!evt.ctrlKey) return;
    evt.preventDefault();
    setZoom(zoom * (evt.deltaY < 0 ? 1.1 : 1 / 1.1), evt.clientX, evt.clientY);
  },
  { passive: false }
);


applyZoom();
updateHouse();
updateModeButtons();

</script>

<script>
/* =========================================================
   五邊形編輯（切角）— 覆寫／擴充既有函式
   物件：house.cut / room.cut = { corner:'tl|tr|bl|br', cx, cy }（cm，被切掉的水平／垂直量）
========================================================= */
house.cut = null;

let pentHover = null;   /* {kind,id,corner} */
let pentSel = null;

const PENT_NAMES = { tl: "左上角", tr: "右上角", bl: "左下角", br: "右下角" };

function geomOf(kind, obj) {
  const s = house.scale;
  if (kind === "house") return { L: house.x, T: house.y, W: house.w * s, H: house.h * s, cut: house.cut };
  return { L: obj.x, T: obj.y, W: obj.w * s, H: obj.h * s, cut: obj.cut };
}

/* 多邊形頂點（依實際比例） */
function shapePts(g) {
  const { L, T, W, H } = g, R = L + W, B = T + H, c = g.cut, s = house.scale;
  const cx = c ? c.cx * s : 0, cy = c ? c.cy * s : 0, k = c ? c.corner : "";
  const P = [];
  if (k === "tl") P.push([L, T + cy], [L + cx, T]); else P.push([L, T]);
  if (k === "tr") P.push([R - cx, T], [R, T + cy]); else P.push([R, T]);
  if (k === "br") P.push([R, B - cy], [R - cx, B]); else P.push([R, B]);
  if (k === "bl") P.push([L + cx, B], [L, B - cy]); else P.push([L, B]);
  return P.map(p => p.join(",")).join(" ");
}

/* 牆段：origin(ox,oy)=原始角落，沿方向(dx,dy)從 s0 到 s1 為實際存在的牆 */
function wallsOf(type, id, g) {
  const { L, T, W, H } = g, R = L + W, B = T + H, c = g.cut, s = house.scale;
  const cx = c ? c.cx * s : 0, cy = c ? c.cy * s : 0, k = c ? c.corner : "";
  const mk = (wall, ox, oy, dx, dy, s0, s1) => ({
    type, id, wall, ox, oy, dx, dy, s0, s1,
    x1: ox + dx * s0, y1: oy + dy * s0, x2: ox + dx * s1, y2: oy + dy * s1
  });
  const w = [
    mk("top", L, T, 1, 0, k === "tl" ? cx : 0, W - (k === "tr" ? cx : 0)),
    mk("bottom", L, B, 1, 0, k === "bl" ? cx : 0, W - (k === "br" ? cx : 0)),
    mk("left", L, T, 0, 1, k === "tl" ? cy : 0, H - (k === "bl" ? cy : 0)),
    mk("right", R, T, 0, 1, k === "tr" ? cy : 0, H - (k === "br" ? cy : 0))
  ];
  if (c) {
    const d = {
      tl: [L + cx, T, L, T + cy], tr: [R - cx, T, R, T + cy],
      bl: [L + cx, B, L, B - cy], br: [R - cx, B, R, B - cy]
    }[k];
    const len = Math.hypot(d[2] - d[0], d[3] - d[1]);
    w.push(mk("diag", d[0], d[1], (d[2] - d[0]) / len, (d[3] - d[1]) / len, 0, len));
  }
  return w;
}

function getAllWalls() {
  const r = wallsOf("house", "house", geomOf("house"));
  rooms.forEach(rm => r.push(...wallsOf("room", rm.id, geomOf("room", rm))));
  return r;
}

function findNearestWall(x, y) {
  let best = null, bd = 25;
  getAllWalls().forEach(w => {
    if (w.s1 - w.s0 <= 0) return;
    const t = (x - w.ox) * w.dx + (y - w.oy) * w.dy;
    if (t < w.s0 - 20 || t > w.s1 + 20) return;
    const c = clamp(t, w.s0, w.s1);
    const d = Math.hypot(x - (w.ox + w.dx * c), y - (w.oy + w.dy * c));
    if (d < bd) { bd = d; best = { ...w, position: c }; }
  });
  return best;
}

function findWallOf(item) {
  return getAllWalls().find(w =>
    w.type === item.parentType && w.id === item.parentId && w.wall === item.wall);
}

function clampC(w, c, len) {
  return (w.s1 - w.s0 >= len) ? clamp(c, w.s0 + len / 2, w.s1 - len / 2) : (w.s0 + w.s1) / 2;
}

/* 沿牆（含斜牆）的帶狀矩形 */
function bandPts(w, c, len, th) {
  const nx = -w.dy, ny = w.dx, cx = w.ox + w.dx * c, cy = w.oy + w.dy * c;
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) =>
    [cx + w.dx * a * len / 2 + nx * b * th / 2, cy + w.dy * a * len / 2 + ny * b * th / 2].join(",")
  ).join(" ");
}

/* ---------- 房屋 ---------- */
function renderHouse() {
  houseLayer.innerHTML = "";
  const g = geomOf("house");
  houseLayer.appendChild(createSVG("polygon", { points: shapePts(g), class: "house" }));

  const wText = createSVG("text", { x: g.L + g.W / 2, y: g.T - 15, class: "dimension", "text-anchor": "middle" });
  wText.textContent = `${Math.round(house.w)} cm`;
  houseLayer.appendChild(wText);

  const rx = g.L + g.W + 15, ry = g.T + g.H / 2;
  const hText = createSVG("text", {
    x: rx, y: ry, class: "dimension", "text-anchor": "middle", transform: `rotate(90 ${rx} ${ry})`
  });
  hText.textContent = `${Math.round(house.h)} cm`;
  houseLayer.appendChild(hText);
}

/* ---------- 房間 ---------- */
function renderResizeHandles(room) {
  const w = roomPixelWidth(room), h = roomPixelHeight(room);
  const pts = { nw: [room.x, room.y], ne: [room.x + w, room.y], sw: [room.x, room.y + h], se: [room.x + w, room.y + h] };
  const map = { nw: "tl", ne: "tr", sw: "bl", se: "br" };
  Object.entries(pts).forEach(([handle, [x, y]]) => {
    if (room.cut && room.cut.corner === map[handle]) return;   /* 被切掉的角沒有控制點 */
    const rect = createSVG("rect", { x: x - 6, y: y - 6, width: 12, height: 12, rx: 2, class: "resize-handle " + handle });
    rect.addEventListener("pointerdown", evt => startResize(evt, room, handle));
    uiLayer.appendChild(rect);
  });
}

function renderRooms() {
  roomLayer.innerHTML = "";
  uiLayer.innerHTML = "";

  rooms.forEach(room => {
    const g = geomOf("room", room);
    const sel = selectedRoomId === room.id;

    const poly = createSVG("polygon", { points: shapePts(g), class: "room" + (sel ? " selected" : "") });
    poly.dataset.id = room.id;
    poly.addEventListener("pointerdown", evt => startRoomDrag(evt, room));
    roomLayer.appendChild(poly);

    const label = createSVG("text", { x: g.L + g.W / 2, y: g.T + g.H / 2, class: "room-label" });
    label.textContent = room.name;
    roomLayer.appendChild(label);

    const size = createSVG("text", { x: g.L + g.W / 2, y: g.T + g.H / 2 + 20, class: "dimension", "text-anchor": "middle" });
    size.textContent = `${Math.round(room.w)} × ${Math.round(room.h)} cm`;
    roomLayer.appendChild(size);

    if (sel) {
      if (mode === "select") renderResizeHandles(room);
      const hw = house.w * house.scale, hh = house.h * house.scale;
      uiLayer.insertBefore(createSVG("line", { x1: house.x, y1: room.y, x2: house.x + hw, y2: room.y, class: "guide" }), uiLayer.firstChild);
      uiLayer.insertBefore(createSVG("line", { x1: room.x, y1: house.y, x2: room.x, y2: house.y + hh, class: "guide" }), uiLayer.firstChild);
    }
  });
}

/* ---------- 窗戶（沿任意牆段，含斜邊） ---------- */
function updateWindowPreview(evt) {
  if (mode !== "window") return;

  const p = svgPoint(evt);
  const wall = findNearestWall(p.x, p.y);

  windowLayer.querySelectorAll(".preview").forEach(el => el.remove());
  previewWindow = null;

  if (!wall) return;

  const cm = Number(document.getElementById("windowW").value);
  if (!cm || cm <= 0) return;

  const len = windowPixelLength(cm);
  const c = clampC(wall, wall.position, len);
  const th = WALL_THICKNESS + 6;

  previewWindow = { wall, center: c, lengthCm: cm };

  windowLayer.appendChild(createSVG("polygon", { points: bandPts(wall, c, len, th), class: "window-preview preview" }));

  const ax = wall.ox + wall.dx * (c - len / 2), ay = wall.oy + wall.dy * (c - len / 2);
  const bx = wall.ox + wall.dx * (c + len / 2), by = wall.oy + wall.dy * (c + len / 2);
  windowLayer.appendChild(createSVG("line", { x1: ax, y1: ay, x2: bx, y2: by, class: "window-preview-line preview" }));

  const hor = wall.wall === "top" || wall.wall === "bottom" || wall.wall === "diag";
  [[wall.s0, c - len / 2, "A"], [c + len / 2, wall.s1, "B"]].forEach(([s, e, name]) => {
    const x1 = wall.ox + wall.dx * s, y1 = wall.oy + wall.dy * s;
    const x2 = wall.ox + wall.dx * e, y2 = wall.oy + wall.dy * e;
    windowLayer.appendChild(createSVG("line", { x1, y1, x2, y2, class: "window-distance-line preview" }));

    const t = createSVG("text", {
      class: "window-distance preview",
      x: (x1 + x2) / 2 + (hor ? 0 : -12),
      y: (y1 + y2) / 2 + (hor ? -14 : 0),
      "text-anchor": hor ? "middle" : "end"
    });
    t.textContent = `${name} ${Math.round(Math.max(0, e - s) / house.scale)} cm`;
    windowLayer.appendChild(t);
  });
}

function placeWindow() {
  if (mode !== "window" || !previewWindow) return;

  const w = previewWindow;
  const nw = {
    id: uid("window"),
    lengthCm: w.lengthCm,
    parentType: w.wall.type,
    parentId: w.wall.id,
    wall: w.wall.wall,
    center: w.center
  };

  windows.push(nw);
  selectedWindowId = nw.id;
  selectedRoomId = null;
  previewWindow = null;

  render();
  showStatus("窗戶已建立");
}

function renderWindow(win) {
  const wall = findWallOf(win);
  if (!wall) return;

  const len = windowPixelLength(win.lengthCm);
  const c = clampC(wall, win.center, len);
  const selected = selectedWindowId === win.id;

  const el = createSVG("polygon", {
    points: bandPts(wall, c, len, WALL_THICKNESS + 6),
    class: "window" + (selected ? " selected" : "")
  });
  el.dataset.id = win.id;
  el.addEventListener("click", evt => {
    evt.stopPropagation();
    if (mode === "select") {
      selectedWindowId = win.id;
      selectedRoomId = null;
      render();
    }
  });

  const line = createSVG("line", {
    x1: wall.ox + wall.dx * (c - len / 2), y1: wall.oy + wall.dy * (c - len / 2),
    x2: wall.ox + wall.dx * (c + len / 2), y2: wall.oy + wall.dy * (c + len / 2),
    class: "window-line"
  });
  if (selected) line.style.stroke = "#d35400";

  windowLayer.appendChild(el);
  windowLayer.appendChild(line);
}

/* ---------- 門（沿任意牆段，含斜邊） ---------- */
function updateDoorPreview(evt) {
  if (mode !== "door") return;

  windowLayer.querySelectorAll(".dpreview").forEach(el => el.remove());
  previewDoor = null;

  const p = svgPoint(evt);
  const wall = findNearestWall(p.x, p.y);
  if (!wall) return;

  const cm = Number(document.getElementById("doorW").value);
  if (!cm || cm <= 0) return;

  const len = Math.min(doorPixelLength(cm), wall.s1 - wall.s0);
  const c = clampC(wall, wall.position, len);

  previewDoor = { wall, widthCm: cm, center: c / house.scale };

  windowLayer.appendChild(createSVG("polygon", {
    points: bandPts(wall, c, len, WALL_THICKNESS + 4),
    class: "door-preview dpreview"
  }));
}

function placeDoor() {
  if (mode !== "door" || !previewDoor) return;

  const d = previewDoor;
  const nd = {
    id: uid("door"),
    widthCm: d.widthCm,
    parentType: d.wall.type,
    parentId: d.wall.id,
    wall: d.wall.wall,
    center: d.center
  };

  doors.push(nd);
  selectedDoorId = nd.id;
  selectedRoomId = null;
  selectedWindowId = null;
  previewDoor = null;

  render();
  showStatus("門已建立（可繼續點擊放置）");
}

function renderDoor(door) {
  const wall = findWallOf(door);
  if (!wall) return;

  const len = Math.min(doorPixelLength(door.widthCm), wall.s1 - wall.s0);
  const c = clampC(wall, door.center * house.scale, len);

  const el = createSVG("polygon", {
    points: bandPts(wall, c, len, WALL_THICKNESS + 4),
    class: "door" + (selectedDoorId === door.id ? " selected" : "")
  });

  el.addEventListener("click", evt => {
    if (mode !== "select") return;
    evt.stopPropagation();
    selectedDoorId = door.id;
    selectedRoomId = null;
    selectedWindowId = null;
    render();
  });

  windowLayer.appendChild(el);
}

/* =========================================================
   五邊形編輯模式
========================================================= */

const pentLayer = createSVG("g", {});
svg.appendChild(pentLayer);

function pentObj(sel) {
  return sel.kind === "house" ? house : rooms.find(r => r.id === sel.id);
}

function cornerCandidates() {
  const out = [];
  const add = (kind, obj) => {
    const id = kind === "house" ? "house" : obj.id;
    const g = geomOf(kind, obj), R = g.L + g.W, B = g.T + g.H;
    const pts = { tl: [g.L, g.T], tr: [R, g.T], bl: [g.L, B], br: [R, B] };
    if (obj.cut) {
      /* 已切角的角：改用斜邊中點作為可點選位置 */
      const d = wallsOf(kind, id, g).find(w => w.wall === "diag");
      pts[obj.cut.corner] = [(d.x1 + d.x2) / 2, (d.y1 + d.y2) / 2];
    }
    Object.entries(pts).forEach(([corner, [x, y]]) => out.push({ kind, id, corner, x, y, obj }));
  };
  add("house", house);
  rooms.forEach(r => add("room", r));
  return out;
}

function pentPick(p) {
  let best = null, bd = 18;
  cornerCandidates().forEach(c => {
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    if (d <= bd) { bd = d; best = c; }   /* 同距離時，房間優先於房屋 */
  });
  return best;
}

const sameCorner = (a, b) => a && b && a.kind === b.kind && a.id === b.id && a.corner === b.corner;

function drawPentUI() {
  pentLayer.innerHTML = "";
  if (mode !== "pentagon") return;

  const cands = cornerCandidates();
  const dot = (c, r, fill, stroke) => pentLayer.appendChild(createSVG("circle", {
    cx: c.x, cy: c.y, r, fill, stroke: stroke || "none", "stroke-width": 2, "pointer-events": "none"
  }));

  cands.forEach(c => dot(c, 4, "rgba(35,103,168,.35)"));

  const sel = cands.find(c => sameCorner(c, pentSel));
  if (sel) dot(sel, 10, "rgba(211,84,0,.25)", "#d35400");

  const hov = cands.find(c => sameCorner(c, pentHover));
  if (hov) dot(hov, 10, "rgba(35,103,168,.3)", "#2367a8");
}

function pentRemaining() {
  return {
    h: parseFloat(document.getElementById("pentRemH").value),
    v: parseFloat(document.getElementById("pentRemV").value)
  };
}

function updatePentInfo() {
  const o = pentSel && pentObj(pentSel);
  const info = document.getElementById("pentInfo");
  if (!o) return;
  const r = pentRemaining();
  const cx = o.w - r.h, cy = o.h - r.v;
  info.textContent = (isFinite(cx) && isFinite(cy) && cx > 0 && cy > 0 && r.h > 0 && r.v > 0)
    ? `斜邊：約 ${Math.round(Math.hypot(cx, cy))} cm（切除 ${Math.round(cx)} × ${Math.round(cy)} cm）`
    : "斜邊：—";
}

function openPentForm() {
  const form = document.getElementById("pentForm");
  const hint = document.getElementById("pentHint");
  const o = pentSel && pentObj(pentSel);

  if (!o) {
    pentSel = null;
    form.style.display = "none";
    hint.style.display = "";
    return;
  }

  const k = pentSel.corner;
  const name = pentSel.kind === "house" ? "房屋外框" : `房間「${o.name}」`;

  document.getElementById("pentTitle").textContent = `${name}　${PENT_NAMES[k]}斜角設定`;
  document.getElementById("pentLabH").textContent =
    `${k[0] === "t" ? "上方" : "下方"}剩餘長度（原 ${Math.round(o.w)} cm）`;
  document.getElementById("pentLabV").textContent =
    `${k[1] === "l" ? "左側" : "右側"}剩餘長度（原 ${Math.round(o.h)} cm）`;

  document.getElementById("pentRemH").value = Math.round(o.cut ? o.w - o.cut.cx : o.w * 0.8);
  document.getElementById("pentRemV").value = Math.round(o.cut ? o.h - o.cut.cy : o.h * 0.8);
  document.getElementById("pentRemove").style.display = o.cut ? "" : "none";

  hint.style.display = "none";
  form.style.display = "flex";
  updatePentInfo();
}

document.getElementById("pentRemH").addEventListener("input", updatePentInfo);
document.getElementById("pentRemV").addEventListener("input", updatePentInfo);

document.getElementById("pentApply").addEventListener("click", () => {
  const o = pentSel && pentObj(pentSel);
  if (!o) return;

  const r = pentRemaining();

  if (!isFinite(r.h) || !isFinite(r.v)) { alert("請輸入有效的數字"); return; }
  if (r.h <= 0 || r.v <= 0) { alert("剩餘長度必須大於 0 cm"); return; }
  if (r.h >= o.w) { alert(`水平方向剩餘長度必須小於原邊長（${Math.round(o.w)} cm），否則不會產生斜角`); return; }
  if (r.v >= o.h) { alert(`垂直方向剩餘長度必須小於原邊長（${Math.round(o.h)} cm），否則不會產生斜角`); return; }

  o.cut = { corner: pentSel.corner, cx: o.w - r.h, cy: o.h - r.v };

  render();
  openPentForm();
  showStatus("斜角已套用");
});

document.getElementById("pentRemove").addEventListener("click", () => {
  const o = pentSel && pentObj(pentSel);
  if (!o || !o.cut) return;

  const pid = pentSel.kind === "house" ? "house" : o.id;
  const onDiag = i => i.wall === "diag" && i.parentType === pentSel.kind && i.parentId === pid;

  o.cut = null;
  windows = windows.filter(i => !onDiag(i));
  doors = doors.filter(i => !onDiag(i));

  render();
  openPentForm();
  showStatus("斜角已移除");
});

/* 滑鼠移到角上 → 高亮 */
svg.addEventListener("pointermove", evt => {
  if (mode !== "pentagon") return;
  const c = pentPick(svgPoint(evt));
  pentHover = c ? { kind: c.kind, id: c.id, corner: c.corner } : null;
  svg.style.cursor = c ? "pointer" : "crosshair";
  drawPentUI();
});

/* 點擊角 → 開啟設定 */
svg.addEventListener("click", evt => {
  if (mode !== "pentagon") return;
  const c = pentPick(svgPoint(evt));
  if (!c) return;

  if (c.obj.cut && c.obj.cut.corner !== c.corner) {
    showStatus("此物件已設定斜角");
    return;
  }

  pentSel = { kind: c.kind, id: c.id, corner: c.corner };
  openPentForm();
  drawPentUI();
});

/* 工具列按鈕：進入／結束 */
document.getElementById("pentModeTop").addEventListener("click", () => {
  if (mode === "pentagon") {
    mode = "select";
  } else {
    mode = "pentagon";
    selectedRoomId = null;
    selectedWindowId = null;
    selectedDoorId = null;
    pentSel = null;
    pentHover = null;
  }
  updateModeButtons();
  render();
  if (mode === "pentagon") showStatus("請點擊房屋或房間的角");
});

/* 包裝：模式按鈕狀態 */
const _updateModeButtons = updateModeButtons;
updateModeButtons = function () {
  _updateModeButtons();

  const btn = document.getElementById("pentModeTop");
  const on = mode === "pentagon";

  btn.classList.toggle("active", on);
  btn.textContent = on ? "✕ 結束五邊形編輯" : "五邊形";
  document.getElementById("panelPentagon").classList.toggle("show", on);

  if (on) {
    document.getElementById("toolPanel").style.display = "flex";
    openPentForm();
  } else {
    pentSel = null;
    pentHover = null;
    svg.style.cursor = "";
  }

  drawPentUI();
};

/* 包裝：render（修正斜角範圍、重畫提示） */
const _render = render;
render = function () {
  [house, ...rooms].forEach(o => {
    if (o.cut) {
      o.cut.cx = Math.min(o.cut.cx, o.w - 1);
      o.cut.cy = Math.min(o.cut.cy, o.h - 1);
    }
  });
  _render();
  drawPentUI();
};

updateModeButtons();
render();

</script>
<script>
/* =========================================================
   V5：匯出 / 拖曳門窗 / 自動儲存 / 清空畫布
========================================================= */

/* ---------- 1. 自動儲存與還原（必須最先執行，早於新的 render 包裝） ---------- */
const STORE_KEY = "floorplan_tool_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || !d.house || !(d.house.w > 0) || !(d.house.h > 0) || !Array.isArray(d.rooms)) return;
    Object.assign(house, d.house);
    rooms = d.rooms;
    windows = Array.isArray(d.windows) ? d.windows : [];
    doors = Array.isArray(d.doors) ? d.doors : [];
    document.getElementById("houseW").value = Math.round(house.w);
    document.getElementById("houseH").value = Math.round(house.h);
  } catch (e) { console.warn("還原失敗", e); }
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ house, rooms, windows, doors }));
  } catch (e) { console.warn("儲存失敗", e); }
}

let saveTimer = null;
loadState();

const _render2 = render;
render = function () {
  _render2();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 150);
};
window.addEventListener("beforeunload", saveState);


/* ---------- 2. 拖曳窗戶／門（只能沿牆移動，可換牆） ---------- */
const _renderDoor2 = renderDoor;
renderDoor = function (door) {
  const before = windowLayer.lastChild;
  _renderDoor2(door);
  const el = windowLayer.lastChild;
  if (el && el !== before) el.dataset.did = door.id;
};

let dragItem = null;   /* {list:'windows'|'doors', id} */

windowLayer.addEventListener("pointerdown", evt => {
  if (mode !== "select") return;
  const t = evt.target;
  if (!t.classList) return;

  if (t.classList.contains("window") && t.dataset.id) {
    dragItem = { kind: "window", id: t.dataset.id };
    selectedWindowId = t.dataset.id;
    selectedDoorId = null;
  } else if (t.classList.contains("door") && t.dataset.did) {
    dragItem = { kind: "door", id: t.dataset.did };
    selectedDoorId = t.dataset.did;
    selectedWindowId = null;
  } else return;

  selectedRoomId = null;
  evt.preventDefault();
  evt.stopPropagation();
  render();
});

svg.addEventListener("pointermove", evt => {
  if (!dragItem) return;

  const item = (dragItem.kind === "window" ? windows : doors).find(i => i.id === dragItem.id);
  if (!item) { dragItem = null; return; }

  const p = svgPoint(evt);
  const wall = findNearestWall(p.x, p.y);
  if (!wall) return;

  const isWin = dragItem.kind === "window";
  const len = isWin ? windowPixelLength(item.lengthCm)
                    : Math.min(doorPixelLength(item.widthCm), wall.s1 - wall.s0);
  const c = clampC(wall, wall.position, len);

  item.parentType = wall.type;
  item.parentId = wall.id;
  item.wall = wall.wall;
  item.center = isWin ? c : c / house.scale;

  render();
});

const stopItemDrag = () => { dragItem = null; };
svg.addEventListener("pointerup", stopItemDrag);
document.addEventListener("pointerup", stopItemDrag);


/* ---------- 3. 匯出格局圖（PNG） ---------- */
const EXPORT_PROPS = [
  "fill", "stroke", "stroke-width", "stroke-dasharray", "opacity",
  "font-size", "font-family", "font-weight", "text-anchor", "dominant-baseline"
];

function inlineStyles(src, dst) {
  const cs = getComputedStyle(src);
  EXPORT_PROPS.forEach(p => dst.style.setProperty(p, cs.getPropertyValue(p)));
  for (let i = 0; i < src.children.length; i++) inlineStyles(src.children[i], dst.children[i]);
}

function exportPlan() {

  if (!confirm("是否匯出格局圖？")) return;

  /* 匯出時不要帶選取狀態 */
  const keep = { r: selectedRoomId, w: selectedWindowId, d: selectedDoorId };
  selectedRoomId = selectedWindowId = selectedDoorId = null;
  render();

  pentLayer.setAttribute("id", "pentLayer");
  const clone = svg.cloneNode(true);
  inlineStyles(svg, clone);

  ["#uiLayer", "#pentLayer", ".preview", ".dpreview"].forEach(sel =>
    clone.querySelectorAll(sel).forEach(el => el.remove())
  );

  /* 只輸出房屋範圍＋邊界 */
  const hw = house.w * house.scale, hh = house.h * house.scale;
  const vx = house.x - 70, vy = house.y - 50, vw = hw + 140, vh = hh + 100;
  const S = 2;

  clone.setAttribute("viewBox", `${vx} ${vy} ${vw} ${vh}`);
  clone.setAttribute("width", vw * S);
  clone.setAttribute("height", vh * S);
  clone.removeAttribute("style");

  const bg = createSVG("rect", { x: vx, y: vy, width: vw, height: vh, fill: "#ffffff" });
  clone.insertBefore(bg, clone.firstChild);

  const xml = new XMLSerializer().serializeToString(clone);

  /* 還原選取狀態 */
  selectedRoomId = keep.r; selectedWindowId = keep.w; selectedDoorId = keep.d;
  render();

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = vw * S;
    canvas.height = vh * S;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "格局圖.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showStatus("格局圖已匯出");
    }, "image/png");
  };
  img.onerror = () => alert("匯出失敗");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

document.getElementById("exportBtn").addEventListener("click", exportPlan);


/* ---------- 4. 清空畫布 ---------- */
document.getElementById("clearBtn").addEventListener("click", () => {

  if (!confirm("確定要清空畫布？\n所有房屋、房間、窗戶、門與已儲存的內容都會被刪除，且無法復原。")) return;

  rooms = [];
  windows = [];
  doors = [];
  house.cut = null;

  selectedRoomId = selectedWindowId = selectedDoorId = null;
  pentSel = null;
  pentHover = null;
  mode = "select";
  activePanel = null;

  document.getElementById("houseW").value = 1000;
  document.getElementById("houseH").value = 800;

  updateHouse();
  updateModeButtons();

  clearTimeout(saveTimer);
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}

  showStatus("畫布已清空");
});

render();

</script>
<script>
/* =========================================================
   V6：手機版（底部工具列、側邊欄收合、觸控操作）
========================================================= */
const mbSidebar = document.querySelector(".sidebar");
const mbWrap = document.querySelector(".canvas-wrap");
const mbMenuBtn = document.getElementById("menuBtn");
const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

/* ☰ 開關側邊欄 */
mbMenuBtn.addEventListener("click", () => mbSidebar.classList.toggle("open"));

/* 側邊欄開著時，點畫布 → 只收起側邊欄（不觸發畫布動作） */
let mbIgnoreClickUntil = 0;

mbWrap.addEventListener("pointerdown", e => {
  if (!isMobile() || !mbSidebar.classList.contains("open")) return;
  mbSidebar.classList.remove("open");
  mbIgnoreClickUntil = Date.now() + 500;
  e.preventDefault();
  e.stopPropagation();
}, true);

mbWrap.addEventListener("click", e => {
  if (Date.now() < mbIgnoreClickUntil) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

/* 觸控：窗戶／門／五邊形沒有「滑鼠移動」，按下時先更新預覽，放開時放置 */
svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  if (mode === "window") updateWindowPreview(e);
  else if (mode === "door") updateDoorPreview(e);
  else if (mode === "pentagon") {
    const c = pentPick(svgPoint(e));
    pentHover = c ? { kind: c.kind, id: c.id, corner: c.corner } : null;
    drawPentUI();
  }
});

svg.addEventListener("pointerup", e => {
  if (e.pointerType === "mouse") return;
  if (mode === "window") placeWindow();
  else if (mode === "door") placeDoor();
});

/* 觸控：一般模式下，按住空白處／房屋底色拖曳 = 平移畫布 */
let mbPan = null;

svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" || mode !== "select") return;
  if (!(e.target === svg || (e.target.classList && e.target.classList.contains("house")))) return;
  mbPan = { x: e.clientX, y: e.clientY, l: mbWrap.scrollLeft, t: mbWrap.scrollTop };
});

document.addEventListener("pointermove", e => {
  if (!mbPan) return;
  mbWrap.scrollLeft = mbPan.l - (e.clientX - mbPan.x);
  mbWrap.scrollTop = mbPan.t - (e.clientY - mbPan.y);
});

const mbEnd = () => { mbPan = null; };
document.addEventListener("pointerup", mbEnd);

/* 觸控被系統中斷時，結束所有拖曳 */
svg.addEventListener("pointercancel", () => {
  mbEnd();
  stopRoomDrag();
  stopResize();
  stopItemDrag();
});

/* 手機初始縮放：盡量讓畫布寬度符合螢幕 */
if (isMobile()) {
  zoom = Math.max(ZOOM_MIN, Math.min(1, (mbWrap.clientWidth - 16) / SVG_W));
  applyZoom();
}

</script>
<script>
/* V6.1：手機版縮放按鈕移到設定欄位上方 */
(function () {
  const zc = document.querySelector(".zoom-controls");
  const tb = document.querySelector(".toolbar");
  const zb = document.createElement("div");
  zb.id = "zoomBar";
  document.querySelector(".main").insertBefore(zb, document.getElementById("toolPanel"));

  const place = () => (isMobile() ? zb : tb).appendChild(zc);

  window.matchMedia("(max-width: 768px)").addEventListener("change", place);
  place();
})();

</script>

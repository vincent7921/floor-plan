<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡易格局圖工具 V5</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Microsoft JhengHei",
    "Noto Sans TC",
    Arial,
    sans-serif;
  background: #f4f5f7;
  color: #222;
  overflow: hidden;
}

header {
  height: 58px;
  background: #222;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 20px;
  font-weight: bold;
}

.app {
  height: calc(100vh - 58px);
  display: flex;
}

/* =========================
   左側控制區
========================= */

.sidebar {
  width: 300px;
  background: white;
  border-right: 1px solid #ddd;
  padding: 16px;
  overflow-y: auto;
}

.section {
  border-bottom: 1px solid #eee;
  padding-bottom: 16px;
  margin-bottom: 16px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.section-title .section-arrow {
  font-size: 12px;
  transition: transform 0.2s ease;
}

.section.collapsed .section-arrow {
  transform: rotate(-90deg);
}

.section.collapsed .section-content {
  display: none;
}

.section h3 {
  margin: 0 0 12px;
  font-size: 16px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
  color: #555;
}

input,
button {
  font-family: inherit;
}

input[type="number"],
input[type="text"] {
  width: 100%;
  height: 36px;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 0 9px;
  margin-bottom: 9px;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 14px;
  background: #333;
  color: white;
}

button:hover {
  opacity: .88;
}

button.secondary {
  background: #777;
}


button.deleteBtn {
  background: #b33a3a;
}

/* 統一按鈕樣式：
   一般／工具列 = 深灰，啟用中與主要動作 = 藍色，刪除 = 紅色 */

button.toolBtn {
  background: #444;
}

button.toolBtn.active {
  background: #2367a8;
}

button.primaryBtn {
  background: #2367a8;
}

.room-item {
  border: 1px solid #ddd;
  border-radius: 7px;
  padding: 9px 10px;
  margin-bottom: 7px;
  cursor: pointer;
  background: #fafafa;
}

.room-item:hover {
  background: #f0f4f8;
}

.room-item.selected {
  border-color: #333;
  background: #eeeeee;
}

.room-name {
  font-weight: bold;
  font-size: 14px;
}

.room-size {
  margin-top: 4px;
  color: #666;
  font-size: 12px;
}

.window-item {
  border: 1px solid #ddd;
  border-radius: 7px;
  padding: 8px 10px;
  margin-bottom: 6px;
  background: #fafafa;
  font-size: 13px;
}

.help {
  font-size: 12px;
  line-height: 1.7;
  color: #777;
}

/* =========================
   主區域
========================= */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.toolbar {
  height: 52px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
}

.toolbar .active {
  background: #2367a8;
}

.canvas-wrap {
  flex: 1;
  overflow: auto;
  padding: 20px;
}

.canvas-box {
  min-width: 1000px;
  min-height: 660px;
  background:
    linear-gradient(#eee 1px, transparent 1px),
    linear-gradient(90deg, #eee 1px, transparent 1px);
  background-size: 20px 20px;
  background-color: #fff;
  border: 1px solid #ddd;
  position: relative;
}

svg {
  width: 1000px;
  height: 660px;
  display: block;
  user-select: none;
}

/* =========================
   圖面
========================= */

.house {
  fill: #fdfdfd;
  stroke: #222;
  stroke-width: 8;
}

.room {
  fill: rgba(100, 150, 200, .12);
  stroke: #555;
  stroke-width: 4;
  cursor: move;
}

.room.selected {
  fill: rgba(80, 130, 190, .20);
  stroke: #222;
}

.dimension {
  font-size: 15px;
  fill: #444;
  pointer-events: none;
}

.room-label {
  font-size: 14px;
  fill: #333;
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: middle;
}

.guide {
  stroke: #aaa;
  stroke-width: 1;
  stroke-dasharray: 5 5;
  pointer-events: none;
}

/* =========================
   房間縮放控制點
========================= */

.resize-handle {
  fill: white;
  stroke: #222;
  stroke-width: 2;
  cursor: nwse-resize;
}

.resize-handle.nw {
  cursor: nwse-resize;
}

.resize-handle.ne {
  cursor: nesw-resize;
}

.resize-handle.sw {
  cursor: nesw-resize;
}

.resize-handle.se {
  cursor: nwse-resize;
}

/* =========================
   窗戶
========================= */

.window {
  fill: white;
  stroke: #2367a8;
  stroke-width: 3;
  cursor: pointer;
}

.window-line {
  stroke: #2367a8;
  stroke-width: 3;
  pointer-events: none;
}

.window.selected {
  stroke: #d35400;
}

.window.selected + .window-line {
  stroke: #d35400;
}

.window-preview {
  fill: rgba(35,103,168,.12);
  stroke: #2367a8;
  stroke-width: 2;
  stroke-dasharray: 5 4;
  pointer-events: none;
}

.window-preview-line {
  stroke: #2367a8;
  stroke-width: 2;
  stroke-dasharray: 5 4;
  pointer-events: none;
}

/* 窗戶 A / B 距離輔助線 */
.window-distance-line {
  stroke: lightblue;
  stroke-width: 2;
  stroke-dasharray: 6 4;
  pointer-events: none;
}

.window-distance {
  font-size: 12px;
  fill: #555;
  pointer-events: none;
  font-weight: normal;
}

.snap-point {
  fill: #2367a8;
  pointer-events: none;
}

/* =========================
   門（牆上的洞）
========================= */

.door {
  fill: white;
  stroke: none;
  cursor: pointer;
}

.door.selected {
  stroke: #d35400;
  stroke-width: 2;
  stroke-dasharray: 4 3;
}

.door-preview {
  fill: rgba(255,255,255,.95);
  stroke: #8a5a2b;
  stroke-width: 2;
  stroke-dasharray: 5 4;
  pointer-events: none;
}

/* =========================
   工具列：按鈕 + 展開設定列
========================= */

.toolbar {
  flex-shrink: 0;
  overflow-x: auto;
}

.toolbar-sep {
  width: 1px;
  height: 24px;
  background: #ddd;
  margin: 0 4px;
}

.tool-panel {
  display: none;
  flex-shrink: 0;
  background: #f0f4f8;
  border-bottom: 1px solid #ddd;
  padding: 10px 14px;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.panel-group {
  display: none;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.panel-group.show {
  display: flex;
}

.tool-panel label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  font-size: 13px;
  color: #444;
  white-space: nowrap;
}

.tool-panel input[type="number"],
.tool-panel input[type="text"] {
  width: 100px;
  height: 34px;
  margin: 0;
}

.tool-panel input[type="text"] {
  width: 140px;
}

.panel-hint {
  font-size: 12px;
  color: #777;
}

/* =========================
   左側圖層
========================= */

.layer-header {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
}

.room-size-edit {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

.room-size-edit input {
  margin: 0;
  flex: 1;
  min-width: 0;
}

.room-name input {
  margin-bottom: 0;
}

.layer-del {
  padding: 3px 8px;
  font-size: 12px;
  margin-top: 6px;
}

/* =========================
   縮放控制 / 圖層選取
========================= */

.toolbar button {
  flex-shrink: 0;
  white-space: nowrap;
}

.zoom-controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.zoom-label {
  min-width: 48px;
  text-align: center;
  font-size: 13px;
  color: #444;
}

.window-item.selected {
  border-color: #333 !important;
  background: #eeeeee;
}

/* =========================
   狀態提示
========================= */

.status {
  position: fixed;
  bottom: 15px;
  right: 20px;
  background: rgba(30,30,30,.88);
  color: white;
  padding: 8px 13px;
  border-radius: 6px;
  font-size: 13px;
  display: none;
}

/* =========================
   手機版
========================= */
svg { touch-action: none; }

#menuBtn {
  display: none;
  background: transparent;
  font-size: 24px;
  line-height: 1;
  padding: 4px 10px;
  margin-right: 6px;
}

@media (max-width: 768px) {

  * { -webkit-tap-highlight-color: transparent; }

  header {
    height: 48px;
    font-size: 17px;
    padding: 0 10px;
  }

  #menuBtn { display: block; }

  .app {
    height: calc(100vh - 48px);
    height: calc(100dvh - 48px);
    position: relative;
  }

  /* 側邊欄：預設收起，☰ 開啟 */
  .sidebar {
    position: fixed;
    top: 48px;
    left: 0;
    bottom: 56px;
    width: 82vw;
    max-width: 320px;
    z-index: 40;
    transform: translateX(-102%);
    transition: transform .25s ease;
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 16px rgba(0,0,0,.28);
  }

  .main { min-height: 0; }

  /* 上到下：畫布 → 設定欄位 → 按鈕列（最下面） */
  .canvas-wrap { order: 1; padding: 8px; min-height: 0; }

  .tool-panel {
    order: 2;
    max-height: 42vh;
    overflow-y: auto;
    padding: 8px 10px;
    gap: 8px 12px;
    border-top: 1px solid #ddd;
  }

  .toolbar {
    order: 3;
    height: 56px;
    padding: 0 8px;
    border-top: 1px solid #ddd;
    border-bottom: 0;
  }

  .tool-panel label {
    white-space: normal;
    flex-wrap: wrap;
  }

  .tool-panel input[type="number"],
  .tool-panel input[type="text"] {
    width: 90px;
    font-size: 16px;
  }

  .status { bottom: 140px; right: 10px; }
}


/* 手機版：縮放按鈕浮在設定欄位上方靠右（設定欄位展開時會一起被推上去） */
#zoomBar { display: none; }

@media (max-width: 768px) {

  #zoomBar {
    display: block;
    order: 2;
    height: 0;
    position: relative;
    z-index: 5;
    flex-shrink: 0;
  }

  .tool-panel { order: 3; }
  .toolbar { order: 4; }

  #zoomBar .zoom-controls {
    position: absolute;
    right: 8px;
    bottom: 8px;
    margin: 0;
    padding: 4px 6px;
    background: rgba(255,255,255,.94);
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
}

</style>
</head>

<body>

<header>
  <button id="menuBtn" type="button" aria-label="圖層選單">☰</button>
  <span>簡易格局圖工具 V6</span>
</header>

<div class="app">

  <!-- =========================
       左側
  ========================== -->

<aside class="sidebar">

  <div class="layer-header">圖層</div>

  <!-- 房屋圖層 -->
  <div class="section">
    <h3 class="section-title">
      <span>房屋</span>
      <span class="section-arrow">▼</span>
    </h3>
    <div class="section-content">
      <div id="houseInfo" class="room-item"></div>
    </div>
  </div>

  <!-- 房間圖層 -->
  <div class="section">
    <h3 class="section-title">
      <span>房間 <span id="roomCount"></span></span>
      <span class="section-arrow">▼</span>
    </h3>
    <div class="section-content">
      <div id="roomList"></div>
    </div>
  </div>

  <!-- 窗戶圖層 -->
  <div class="section">
    <h3 class="section-title">
      <span>窗戶 <span id="windowCount"></span></span>
      <span class="section-arrow">▼</span>
    </h3>
    <div class="section-content">
      <div id="windowList"></div>
    </div>
  </div>

  <!-- 門圖層 -->
  <div class="section">
    <h3 class="section-title">
      <span>門 <span id="doorCount"></span></span>
      <span class="section-arrow">▼</span>
    </h3>
    <div class="section-content">
      <div id="doorList"></div>
    </div>
  </div>

  <!-- 操作說明 -->
  <div class="section collapsed">
    <h3 class="section-title">
      <span>操作說明</span>
      <span class="section-arrow">▼</span>
    </h3>
    <div class="section-content">
      <div class="help">
        • 上方按鈕可新增房屋外框、房間、窗戶、門<br>
        • 房間可以直接拖曳移動，靠近牆壁會自動吸附<br>
        • 選取房間後，四角可以拖拉調整大小<br>
        • 繪製窗戶／門：滑鼠移到牆上，點一下放置，可連續放置<br>
        • 左側圖層可選取、修改房間名稱與尺寸、刪除物件
      </div>
    </div>
  </div>

</aside>


  <!-- =========================
       主畫布
  ========================== -->

  <main class="main">

    <div class="toolbar">

      <button id="toolHouse" class="toolBtn">房屋外框</button>
      <button id="toolRoom" class="toolBtn">新增房間</button>
      <button id="windowModeTop" class="toolBtn">繪製窗戶</button>
      <button id="doorModeTop" class="toolBtn">繪製門</button>
      <button id="pentModeTop" class="toolBtn">五邊形</button>
      <button id="exportBtn" class="toolBtn">匯出</button>
      <button id="clearBtn" class="toolBtn" style="background:#b33a3a">清空畫布</button>

      <div class="zoom-controls">
        <button id="zoomOut" class="toolBtn" title="縮小">－</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomIn" class="toolBtn" title="放大">＋</button>
        <button id="zoomReset" class="toolBtn" title="恢復 100%">重設</button>
      </div>

    </div>

    <div id="toolPanel" class="tool-panel">

      <!-- 五邊形編輯 -->
      <div id="panelPentagon" class="panel-group">
        <span id="pentHint" class="panel-hint">請直接點擊房屋外框或房間的角，設定斜角</span>
        <div id="pentForm" style="display:none; align-items:center; gap:14px; flex-wrap:wrap;">
          <strong id="pentTitle"></strong>
          <label><span id="pentLabH"></span><input id="pentRemH" type="number" min="1"></label>
          <label><span id="pentLabV"></span><input id="pentRemV" type="number" min="1"></label>
          <span id="pentInfo" class="panel-hint"></span>
          <button id="pentApply" class="primaryBtn">套用斜角</button>
          <button id="pentRemove" class="deleteBtn">移除斜角</button>
        </div>
      </div>


      <!-- 房屋外框 -->
      <div id="panelHouse" class="panel-group">
        <label>房屋長度（cm）<input id="houseW" type="number" value="1000"></label>
        <label>房屋寬度（cm）<input id="houseH" type="number" value="800"></label>
        <button id="createHouse" class="primaryBtn">建立／更新外框</button>
      </div>

      <!-- 新增房間 -->
      <div id="panelRoom" class="panel-group">
        <label>名稱<input id="roomName" type="text" placeholder="例如：主臥室"></label>
        <label>長度（cm）<input id="roomW" type="number" value="300"></label>
        <label>寬度（cm）<input id="roomH" type="number" value="300"></label>
        <button id="addRoom" class="primaryBtn">＋ 新增房間</button>
      </div>

      <!-- 繪製窗戶 -->
      <div id="panelWindow" class="panel-group">
        <label>窗戶長度（cm）<input id="windowW" type="number" value="120" min="1"></label>
        <button id="windowMode" class="primaryBtn">✕ 結束繪製窗戶</button>
        <span class="panel-hint">把滑鼠移到牆壁附近，點一下放置，可連續放置</span>
      </div>

      <!-- 繪製門 -->
      <div id="panelDoor" class="panel-group">
        <label>門寬（cm）<input id="doorW" type="number" value="90" min="1"></label>
        <button id="doorMode" class="primaryBtn">✕ 結束繪製門</button>
        <span class="panel-hint">門的中心就是滑鼠位置，點一下開一個洞，可連續放置</span>
      </div>

    </div>


    <div class="canvas-wrap">

      <div class="canvas-box">

        <svg
          id="svg"
          viewBox="0 0 1000 660"
          xmlns="http://www.w3.org/2000/svg"
        >

          <g id="houseLayer"></g>

          <g id="roomLayer"></g>

          <g id="windowLayer"></g>

          <g id="uiLayer"></g>

        </svg>

      </div>

    </div>

  </main>

</div>


<div id="status" class="status"></div>


<script>

/* =========================================================
   基本資料
========================================================= */

const svg = document.getElementById("svg");

const houseLayer = document.getElementById("houseLayer");
const roomLayer = document.getElementById("roomLayer");
const windowLayer = document.getElementById("windowLayer");
const uiLayer = document.getElementById("uiLayer");

const roomList = document.getElementById("roomList");
const windowList = document.getElementById("windowList");
const doorList = document.getElementById("doorList");

const statusBox = document.getElementById("status");

let house = {
  w: 1000,
  h: 800,
  x: 100,
  y: 80,
  scale: 0.7
};

let rooms = [];

let windows = [];

let doors = [];

let selectedRoomId = null;
let selectedWindowId = null;
let selectedDoorId = null;

let mode = "select";

let dragData = null;

let resizeData = null;

let previewWindow = null;
let previewDoor = null;
let activePanel = null;   /* 'house' | 'room' | null */


/* =========================================================
   常數
========================================================= */

const SVG_W = 1000;
const SVG_H = 660;

const MAX_HOUSE_W = 800;
const MAX_HOUSE_H = 500;

const SNAP = 12;

const MIN_ROOM_SIZE = 40;

const WALL_THICKNESS = 8;


/* =========================================================
   工具
========================================================= */

function createSVG(tag, attrs = {}) {

  const el = document.createElementNS(
    "http://www.w3.org/2000/svg",
    tag
  );

  Object.entries(attrs).forEach(([key, value]) => {
    el.setAttribute(key, value);
  });

  return el;
}


function uid(prefix = "id") {

  return prefix + "_" +
    Math.random().toString(36).slice(2) +
    Date.now().toString(36);

}


function clamp(value, min, max) {

  return Math.max(min, Math.min(max, value));

}


function svgPoint(evt) {

  const rect = svg.getBoundingClientRect();

  return {
    x: (evt.clientX - rect.left) *
       (SVG_W / rect.width),

    y: (evt.clientY - rect.top) *
       (SVG_H / rect.height)
  };

}


function showStatus(text) {

  statusBox.textContent = text;
  statusBox.style.display = "block";

  clearTimeout(showStatus.timer);

  showStatus.timer = setTimeout(() => {
    statusBox.style.display = "none";
  }, 1800);

}

/* =========================================================
   設定窗
========================================================= */
document.querySelectorAll(".section-title").forEach(title => {

  title.addEventListener("click", () => {

    const section =
      title.closest(".section");

    section.classList.toggle("collapsed");

  });

});

/* =========================================================
   房屋
========================================================= */

function updateHouse() {

  const w = Number(
    document.getElementById("houseW").value
  );

  const h = Number(
    document.getElementById("houseH").value
  );

  if (!w || !h || w <= 0 || h <= 0) {
    alert("請輸入有效的房屋長寬");
    return;
  }

  house.w = w;
  house.h = h;

  house.scale = Math.min(
    MAX_HOUSE_W / w,
    MAX_HOUSE_H / h
  );

  house.x =
    (SVG_W - w * house.scale) / 2;

  house.y =
    (SVG_H - h * house.scale) / 2;

  /* 房間重新限制在房屋內 */

  rooms.forEach(room => {

    const rw = room.w * house.scale;
    const rh = room.h * house.scale;

    room.x = clamp(
      room.x,
      house.x,
      house.x + house.w * house.scale - rw
    );

    room.y = clamp(
      room.y,
      house.y,
      house.y + house.h * house.scale - rh
    );

  });

  render();

}


document
  .getElementById("createHouse")
  .addEventListener("click", updateHouse);


/* =========================================================
   房間
========================================================= */

function addRoom() {

  const name =
    document.getElementById("roomName").value.trim()
    || "房間";

  const w =
    Number(document.getElementById("roomW").value);

  const h =
    Number(document.getElementById("roomH").value);

  if (!w || !h || w <= 0 || h <= 0) {

    alert("請輸入有效的房間長寬");
    return;

  }

  const room = {

    id: uid("room"),

    name,

    w,

    h,

    x: house.x + 20,

    y: house.y + 20

  };


  /* 如果房間太大，縮小初始位置 */

  const maxW = house.w;

  const maxH = house.h;

  room.w =
    Math.min(room.w, maxW);

  room.h =
    Math.min(room.h, maxH);


  const roomPixelW =
    room.w * house.scale;

  const roomPixelH =
    room.h * house.scale;


  room.x =
    house.x +
    Math.max(0, (house.w * house.scale - roomPixelW) / 2);

  room.y =
    house.y +
    Math.max(0, (house.h * house.scale - roomPixelH) / 2);


  rooms.push(room);

  selectedRoomId = room.id;

  selectedWindowId = null;

  render();

}


document
  .getElementById("addRoom")
  .addEventListener("click", addRoom);


/* =========================================================
   房間尺寸換算
========================================================= */

function roomPixelWidth(room) {

  return room.w * house.scale;

}


function roomPixelHeight(room) {

  return room.h * house.scale;

}


function roomFromPoint(x, y) {

  for (let i = rooms.length - 1; i >= 0; i--) {

    const room = rooms[i];

    const w = roomPixelWidth(room);
    const h = roomPixelHeight(room);

    if (
      x >= room.x &&
      x <= room.x + w &&
      y >= room.y &&
      y <= room.y + h
    ) {
      return room;
    }

  }

  return null;

}


/* =========================================================
   房間拖曳
========================================================= */

function startRoomDrag(evt, room) {

  if (mode !== "select") return;

  const p = svgPoint(evt);

  selectedRoomId = room.id;
  selectedWindowId = null;

  dragData = {

    room,

    offsetX: p.x - room.x,

    offsetY: p.y - room.y

  };

  evt.stopPropagation();

  render();

}


function moveRoomDrag(evt) {

  if (!dragData) return;

  const p = svgPoint(evt);

  const room = dragData.room;

  const rw = roomPixelWidth(room);
  const rh = roomPixelHeight(room);

  let newX =
    p.x - dragData.offsetX;

  let newY =
    p.y - dragData.offsetY;


  /* 房屋邊界 */

  newX = clamp(
    newX,
    house.x,
    house.x +
      house.w * house.scale -
      rw
  );

  newY = clamp(
    newY,
    house.y,
    house.y +
      house.h * house.scale -
      rh
  );


  /* 自動吸附 */

  const snapped =
    snapRoomPosition(
      room,
      newX,
      newY
    );

  room.x = snapped.x;
  room.y = snapped.y;

  render();

}


function stopRoomDrag() {

  dragData = null;

}


/* =========================================================
   房間自動吸附
========================================================= */

function snapRoomPosition(room, x, y) {

  const rw = roomPixelWidth(room);
  const rh = roomPixelHeight(room);

  const houseRight =
    house.x +
    house.w * house.scale;

  const houseBottom =
    house.y +
    house.h * house.scale;


  let sx = x;
  let sy = y;


  /* 房屋牆 */

  if (
    Math.abs(x - house.x) <= SNAP
  ) {
    sx = house.x;
  }

  if (
    Math.abs(
      x + rw - houseRight
    ) <= SNAP
  ) {
    sx = houseRight - rw;
  }

  if (
    Math.abs(y - house.y) <= SNAP
  ) {
    sy = house.y;
  }

  if (
    Math.abs(
      y + rh - houseBottom
    ) <= SNAP
  ) {
    sy = houseBottom - rh;
  }


  /* 其他房間 */

  rooms.forEach(other => {

    if (other.id === room.id) return;

    const ow = roomPixelWidth(other);
    const oh = roomPixelHeight(other);

    const ox1 = other.x;
    const ox2 = other.x + ow;

    const oy1 = other.y;
    const oy2 = other.y + oh;


    /* 左右牆 */

    if (
      Math.abs(
        x + rw - ox1
      ) <= SNAP
    ) {

      if (
        y + rh >= oy1 &&
        y <= oy2
      ) {
        sx = ox1 - rw;
      }

    }

    if (
      Math.abs(
        x - ox2
      ) <= SNAP
    ) {

      if (
        y + rh >= oy1 &&
        y <= oy2
      ) {
        sx = ox2;
      }

    }


    /* 上下牆 */

    if (
      Math.abs(
        y + rh - oy1
      ) <= SNAP
    ) {

      if (
        x + rw >= ox1 &&
        x <= ox2
      ) {
        sy = oy1 - rh;
      }

    }

    if (
      Math.abs(
        y - oy2
      ) <= SNAP
    ) {

      if (
        x + rw >= ox1 &&
        x <= ox2
      ) {
        sy = oy2;
      }

    }

  });


  sx = clamp(
    sx,
    house.x,
    houseRight - rw
  );

  sy = clamp(
    sy,
    house.y,
    houseBottom - rh
  );


  return {
    x: sx,
    y: sy
  };

}


/* =========================================================
   房間四角縮放
========================================================= */

function startResize(evt, room, handle) {

  if (mode !== "select") return;

  evt.stopPropagation();

  const p = svgPoint(evt);

  selectedRoomId = room.id;
  selectedWindowId = null;

  resizeData = {

    room,

    handle,

    startX: p.x,

    startY: p.y,

    originalX: room.x,

    originalY: room.y,

    originalW: room.w,

    originalH: room.h

  };

  render();

}


function moveResize(evt) {

  if (!resizeData) return;

  const p = svgPoint(evt);

  const data = resizeData;

  const room = data.room;

  const dx =
    p.x - data.startX;

  const dy =
    p.y - data.startY;


  let left =
    data.originalX;

  let top =
    data.originalY;

  let right =
    data.originalX +
    data.originalW *
    house.scale;

  let bottom =
    data.originalY +
    data.originalH *
    house.scale;


  /* =========================
     依照拖曳方向計算新位置
  ========================= */

  if (data.handle.includes("w")) {
    left += dx;
  }

  if (data.handle.includes("e")) {
    right += dx;
  }

  if (data.handle.includes("n")) {
    top += dy;
  }

  if (data.handle.includes("s")) {
    bottom += dy;
  }


  /* =========================
     最小尺寸
  ========================= */

  if (
    right - left <
    MIN_ROOM_SIZE
  ) {

    if (data.handle.includes("w")) {

      left =
        right -
        MIN_ROOM_SIZE;

    } else {

      right =
        left +
        MIN_ROOM_SIZE;

    }

  }


  if (
    bottom - top <
    MIN_ROOM_SIZE
  ) {

    if (data.handle.includes("n")) {

      top =
        bottom -
        MIN_ROOM_SIZE;

    } else {

      bottom =
        top +
        MIN_ROOM_SIZE;

    }

  }


  /* =========================
     房屋邊界
  ========================= */

  const houseRight =
    house.x +
    house.w *
    house.scale;

  const houseBottom =
    house.y +
    house.h *
    house.scale;


  if (left < house.x) {
    left = house.x;
  }

  if (top < house.y) {
    top = house.y;
  }

  if (right > houseRight) {
    right = houseRight;
  }

  if (bottom > houseBottom) {
    bottom = houseBottom;
  }


  /* =========================
     縮放吸附
  ========================= */

  const SNAP_DISTANCE = 10;


  /*
     找附近的垂直線
     包含：
     1. 房屋左牆
     2. 房屋右牆
     3. 其他房間左右牆
  */

  const verticalLines = [

    house.x,

    houseRight

  ];


  rooms.forEach(other => {

    if (
      other.id === room.id
    ) {
      return;
    }

    const otherRight =
      other.x +
      other.w *
      house.scale;

    verticalLines.push(
      other.x,
      otherRight
    );

  });


  /*
     找附近的水平線
     包含：
     1. 房屋上牆
     2. 房屋下牆
     3. 其他房間上下牆
  */

  const horizontalLines = [

    house.y,

    houseBottom

  ];


  rooms.forEach(other => {

    if (
      other.id === room.id
    ) {
      return;
    }

    const otherBottom =
      other.y +
      other.h *
      house.scale;

    horizontalLines.push(
      other.y,
      otherBottom
    );

  });


  /* =========================
     左右邊吸附
  ========================= */

  if (
    data.handle.includes("w")
  ) {

    let nearest = null;
    let minDistance =
      SNAP_DISTANCE;


    verticalLines.forEach(x => {

      const distance =
        Math.abs(
          left - x
        );


      if (
        distance <=
        minDistance
      ) {

        minDistance =
          distance;

        nearest = x;

      }

    });


    if (nearest !== null) {

      left = nearest;

    }

  }


  if (
    data.handle.includes("e")
  ) {

    let nearest = null;
    let minDistance =
      SNAP_DISTANCE;


    verticalLines.forEach(x => {

      const distance =
        Math.abs(
          right - x
        );


      if (
        distance <=
        minDistance
      ) {

        minDistance =
          distance;

        nearest = x;

      }

    });


    if (nearest !== null) {

      right = nearest;

    }

  }


  /* =========================
     上下邊吸附
  ========================= */

  if (
    data.handle.includes("n")
  ) {

    let nearest = null;
    let minDistance =
      SNAP_DISTANCE;


    horizontalLines.forEach(y => {

      const distance =
        Math.abs(
          top - y
        );


      if (
        distance <=
        minDistance
      ) {

        minDistance =
          distance;

        nearest = y;

      }

    });


    if (nearest !== null) {

      top = nearest;

    }

  }


  if (
    data.handle.includes("s")
  ) {

    let nearest = null;
    let minDistance =
      SNAP_DISTANCE;


    horizontalLines.forEach(y => {

      const distance =
        Math.abs(
          bottom - y
        );


      if (
        distance <=
        minDistance
      ) {

        minDistance =
          distance;

        nearest = y;

      }

    });


    if (nearest !== null) {

      bottom = nearest;

    }

  }


  /* =========================
     吸附後再次確認最小尺寸
  ========================= */

  if (
    right - left <
    MIN_ROOM_SIZE
  ) {

    if (
      data.handle.includes("w")
    ) {

      left =
        right -
        MIN_ROOM_SIZE;

    } else {

      right =
        left +
        MIN_ROOM_SIZE;

    }

  }


  if (
    bottom - top <
    MIN_ROOM_SIZE
  ) {

    if (
      data.handle.includes("n")
    ) {

      top =
        bottom -
        MIN_ROOM_SIZE;

    } else {

      bottom =
        top +
        MIN_ROOM_SIZE;

    }

  }


  /* =========================
     更新房間
  ========================= */

  room.x = left;

  room.y = top;

  room.w =
    (right - left) /
    house.scale;

  room.h =
    (bottom - top) /
    house.scale;


  render();

}


function stopResize() {

  resizeData = null;

}


/* =========================================================
   建立房間縮放控制點
========================================================= */

function renderResizeHandles(room) {

  const w =
    roomPixelWidth(room);

  const h =
    roomPixelHeight(room);

  const points = {

    nw: [room.x, room.y],

    ne: [room.x + w, room.y],

    sw: [room.x, room.y + h],

    se: [room.x + w, room.y + h]

  };


  Object.entries(points).forEach(
    ([handle, [x, y]]) => {

      const rect =
        createSVG("rect", {

          x: x - 6,

          y: y - 6,

          width: 12,

          height: 12,

          rx: 2,

          class:
            "resize-handle " +
            handle

        });


      rect.addEventListener(
        "pointerdown",
        evt =>
          startResize(
            evt,
            room,
            handle
          )
      );


      uiLayer.appendChild(rect);

    }
  );

}


/* =========================================================
   刪除房間
========================================================= */

function removeRoom(id) {

  rooms = rooms.filter(room => room.id !== id);

  /* 該房間牆上的窗戶一起移除（門在 render 時會自動清掉） */
  windows = windows.filter(
    w => !(w.parentType === "room" && w.parentId === id)
  );

  if (selectedRoomId === id) {
    selectedRoomId = null;
  }

  render();

}


/* =========================================================
   窗戶
========================================================= */

/*
  wall:

  "top"
  "bottom"
  "left"
  "right"

  parentType:

  "house"
  "room"
*/


function getAllWalls() {

  const walls = [];

  /* 房屋四面 */

  walls.push({

    type: "house",

    id: "house",

    wall: "top",

    x1: house.x,

    y1: house.y,

    x2:
      house.x +
      house.w *
      house.scale,

    y2: house.y

  });


  walls.push({

    type: "house",

    id: "house",

    wall: "bottom",

    x1: house.x,

    y1:
      house.y +
      house.h *
      house.scale,

    x2:
      house.x +
      house.w *
      house.scale,

    y2:
      house.y +
      house.h *
      house.scale

  });


  walls.push({

    type: "house",

    id: "house",

    wall: "left",

    x1: house.x,

    y1: house.y,

    x2: house.x,

    y2:
      house.y +
      house.h *
      house.scale

  });


  walls.push({

    type: "house",

    id: "house",

    wall: "right",

    x1:
      house.x +
      house.w *
      house.scale,

    y1: house.y,

    x2:
      house.x +
      house.w *
      house.scale,

    y2:
      house.y +
      house.h *
      house.scale

  });


  /* 房間四面 */

  rooms.forEach(room => {

    const x1 = room.x;
    const y1 = room.y;

    const x2 =
      room.x +
      roomPixelWidth(room);

    const y2 =
      room.y +
      roomPixelHeight(room);


    walls.push({

      type: "room",

      id: room.id,

      wall: "top",

      x1, y1, x2, y2: y1

    });


    walls.push({

      type: "room",

      id: room.id,

      wall: "bottom",

      x1, y1: y2, x2, y2

    });


    walls.push({

      type: "room",

      id: room.id,

      wall: "left",

      x1, y1, x2: x1, y2

    });


    walls.push({

      type: "room",

      id: room.id,

      wall: "right",

      x1: x2, y1, x2, y2

    });

  });


  return walls;

}


/* =========================================================
   找到滑鼠附近的牆
========================================================= */

function findNearestWall(x, y) {

  const walls =
    getAllWalls();

  let best = null;

  let bestDistance = Infinity;


  walls.forEach(wall => {

    let distance;

    let position;

    let valid = false;


    if (
      wall.wall === "top" ||
      wall.wall === "bottom"
    ) {

      if (
        x >= wall.x1 - 20 &&
        x <= wall.x2 + 20
      ) {

        distance =
          Math.abs(
            y - wall.y1
          );

        position =
          clamp(
            x,
            wall.x1,
            wall.x2
          );

        valid = true;

      }

    } else {

      if (
        y >= wall.y1 - 20 &&
        y <= wall.y2 + 20
      ) {

        distance =
          Math.abs(
            x - wall.x1
          );

        position =
          clamp(
            y,
            wall.y1,
            wall.y2
          );

        valid = true;

      }

    }


    if (
      valid &&
      distance < bestDistance &&
      distance <= 25
    ) {

      bestDistance = distance;

      best = {

        ...wall,

        position

      };

    }

  });


  return best;

}


/* =========================================================
   窗戶尺寸
========================================================= */

function windowPixelLength(lengthCm) {

  return lengthCm *
    house.scale;

}


/* =========================================================
   建立窗戶預覽
========================================================= */
function updateWindowPreview(evt) {

  if (mode !== "window") return;

  const p = svgPoint(evt);

  const wall =
    findNearestWall(
      p.x,
      p.y
    );


  windowLayer
    .querySelectorAll(".preview")
    .forEach(el => el.remove());


  if (!wall) {

    previewWindow = null;

    return;

  }


  const lengthCm =
    Number(
      document.getElementById(
        "windowW"
      ).value
    );


  if (
    !lengthCm ||
    lengthCm <= 0
  ) {

    previewWindow = null;

    return;

  }


  const length =
    windowPixelLength(
      lengthCm
    );


  /*
    窗戶中心固定在牆面吸附位置
  */

  const center =
    wall.position;


  let rect;


  /*
    水平牆
  */

  if (
    wall.wall === "top" ||
    wall.wall === "bottom"
  ) {

    rect = {

      x:
        center -
        length / 2,

      y:
        wall.y1 -
        (WALL_THICKNESS + 6) / 2,

      width:
        length,

      height:
        WALL_THICKNESS + 6

    };

  }


  /*
    垂直牆
  */

  else {

    rect = {

      x:
        wall.x1 -
        (WALL_THICKNESS + 6) / 2,

      y:
        center -
        length / 2,

      width:
        WALL_THICKNESS + 6,

      height:
        length

    };

  }


  previewWindow = {

    wall,

    rect,

    lengthCm

  };


  /*
    ============================
    窗戶本體
    ============================
  */

  const preview =
    createSVG(
      "rect",
      {

        ...rect,

        class:
          "window-preview preview"

      }
    );


  /*
    ============================
    窗戶中央線
    ============================
  */

  const lineAttrs =
    wall.wall === "top" ||
    wall.wall === "bottom"

    ? {

        x1:
          rect.x,

        y1:
          wall.y1,

        x2:
          rect.x +
          rect.width,

        y2:
          wall.y1

      }

    : {

        x1:
          wall.x1,

        y1:
          rect.y,

        x2:
          wall.x1,

        y2:
          rect.y +
          rect.height

      };


  const line =
    createSVG(
      "line",
      {

        ...lineAttrs,

        class:
          "window-preview-line preview"

      }
    );


  windowLayer.appendChild(
    preview
  );

  windowLayer.appendChild(
    line
  );


  /*
    ============================
    計算窗戶兩端距離
    ============================
  */

  const wallPixelLength =
    (
      wall.wall === "top" ||
      wall.wall === "bottom"
    )
      ? Math.abs(
          wall.x2 -
          wall.x1
        )
      : Math.abs(
          wall.y2 -
          wall.y1
        );


  /*
    目前窗戶中心距離牆起點的像素
  */

  const centerPixel =
    (
      wall.wall === "top" ||
      wall.wall === "bottom"
    )
      ? center -
        wall.x1
      : center -
        wall.y1;


  /*
    像素 → cm
  */

  const pixelToCm =
    wallPixelLength > 0
      ? (
          (
            wall.wall === "top" ||
            wall.wall === "bottom"
          )
            ? (
                wallPixelLength /
                (
                  wall.type === "house"
                    ? house.w
                    : rooms.find(
                        r =>
                          r.id ===
                          wall.id
                      )?.w || 1
                )
              )
            : (
                wallPixelLength /
                (
                  wall.type === "house"
                    ? house.h
                    : rooms.find(
                        r =>
                          r.id ===
                          wall.id
                      )?.h || 1
                )
              )
        )
      : 1;


  /*
    窗戶兩端位置
  */

  const halfLength =
    length / 2;


  const startPixel =
    centerPixel -
    halfLength;


  const endPixel =
    centerPixel +
    halfLength;


  /*
    轉換成實際 cm
  */

  const startCm =
    Math.round(
      startPixel /
      pixelToCm
    );


  const endCm =
    Math.round(
      (
        wallPixelLength -
        endPixel
      ) /
      pixelToCm
    );


  /*
    ============================
    建立距離文字
    ============================
  */

  const distanceA =
    createSVG(
      "text",
      {

        class:
          "window-distance preview",

        x:
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? (
                wall.x1 +
                rect.x
              ) / 2

            : wall.x1 - 12,

        y:
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? wall.y1 - 14

            : (
                wall.y1 +
                rect.y
              ) / 2,

        "text-anchor":
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? "middle"

            : "end"

      }
    );


  distanceA.textContent =
    `A ${startCm} cm`;


  const distanceB =
    createSVG(
      "text",
      {

        class:
          "window-distance preview",

        x:
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? (
                rect.x +
                rect.width +
                wall.x2
              ) / 2

            : wall.x1 + 12,

        y:
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? wall.y1 - 14

            : (
                rect.y +
                rect.height +
                wall.y2
              ) / 2,

        "text-anchor":
          wall.wall === "top" ||
          wall.wall === "bottom"

            ? "middle"

            : "start"

      }
    );


  distanceB.textContent =
    `B ${endCm} cm`;


  windowLayer.appendChild(
    distanceA
  );

  windowLayer.appendChild(
    distanceB
  );
  
    /* =========================
     A / B 距離輔助線
  ========================= */

  if (
    wall.wall === "top" ||
    wall.wall === "bottom"
  ) {

    const lineA =
      createSVG(
        "line",
        {
          x1: wall.x1,
          y1: wall.y1,
          x2: rect.x,
          y2: wall.y1,
          class:
            "window-distance-line preview"
        }
      );

    const lineB =
      createSVG(
        "line",
        {
          x1:
            rect.x +
            rect.width,
          y1: wall.y1,
          x2: wall.x2,
          y2: wall.y1,
          class:
            "window-distance-line preview"
        }
      );

    windowLayer.appendChild(lineA);
    windowLayer.appendChild(lineB);

  } else {

    const lineA =
      createSVG(
        "line",
        {
          x1: wall.x1,
          y1: wall.y1,
          x2: wall.x1,
          y2: rect.y,
          class:
            "window-distance-line preview"
        }
      );

    const lineB =
      createSVG(
        "line",
        {
          x1: wall.x1,
          y1:
            rect.y +
            rect.height,
          x2: wall.x1,
          y2: wall.y2,
          class:
            "window-distance-line preview"
        }
      );

    windowLayer.appendChild(lineA);
    windowLayer.appendChild(lineB);

  }

}

/* =========================================================
   放置窗戶
========================================================= */

function placeWindow(evt) {

  if (
    mode !== "window" ||
    !previewWindow
  ) {
    return;
  }


  const w =
    previewWindow;


  /*
    取得滑鼠點擊位置
  */

  const p =
    svgPoint(evt);


  /*
    把滑鼠點擊位置轉換成
    「相對於牆起點的距離」

    renderWindow() 使用的 center
    就是這個數值。
  */

  let center;


  if (
    w.wall.wall === "top" ||
    w.wall.wall === "bottom"
  ) {

    center =
      p.x -
      w.wall.x1;

  } else {

    center =
      p.y -
      w.wall.y1;

  }


  const newWindow = {

    id:
      uid("window"),

    lengthCm:
      w.lengthCm,

    parentType:
      w.wall.type,

    parentId:
      w.wall.id,

    wall:
      w.wall.wall,

    center:
      center

  };


  windows.push(
    newWindow
  );


  selectedWindowId =
    newWindow.id;

  selectedRoomId =
    null;

  previewWindow =
    null;


  render();

  showStatus(
    "窗戶已建立"
  );

}

/* =========================================================
   繪製窗戶
========================================================= */

function renderWindow(win) {

  const parent =
    win.parentType === "house"
      ? house
      : rooms.find(
          r =>
            r.id === win.parentId
        );


  if (!parent) return;


  let wallX;
  let wallY;

  let wallLength;


  if (
    win.parentType === "house"
  ) {

    if (
      win.wall === "top" ||
      win.wall === "bottom"
    ) {

      wallX = house.x;
      wallY =
        win.wall === "top"
          ? house.y
          : house.y +
            house.h *
            house.scale;

      wallLength =
        house.w *
        house.scale;

    } else {

      wallX =
        win.wall === "left"
          ? house.x
          : house.x +
            house.w *
            house.scale;

      wallY =
        house.y;

      wallLength =
        house.h *
        house.scale;

    }

  } else {

    const room = parent;

    const rw =
      roomPixelWidth(room);

    const rh =
      roomPixelHeight(room);


    if (
      win.wall === "top" ||
      win.wall === "bottom"
    ) {

      wallX =
        room.x;

      wallY =
        win.wall === "top"
          ? room.y
          : room.y + rh;

      wallLength =
        rw;

    } else {

      wallX =
        win.wall === "left"
          ? room.x
          : room.x + rw;

      wallY =
        room.y;

      wallLength =
        rh;

    }

  }


  const length =
    windowPixelLength(
      win.lengthCm
    );


  let center =
    win.center;



  let rect;


  if (
    win.wall === "top" ||
    win.wall === "bottom"
  ) {

    rect = {

      x:
        wallX +
        center -
        length / 2,

      y:
        wallY -
        (WALL_THICKNESS + 6) / 2,

      width: length,

      height:
        WALL_THICKNESS + 6

    };

  } else {

    rect = {

      x:
        wallX -
        (WALL_THICKNESS + 6) / 2,

      y:
        wallY +
        center -
        length / 2,

      width:
        WALL_THICKNESS + 6,

      height: length

    };

  }


  const selected =
    selectedWindowId ===
    win.id;


  const rectEl =
    createSVG(
      "rect",
      {

        ...rect,

        class:
          "window" +
          (selected
            ? " selected"
            : "")

      }
    );


  rectEl.dataset.id =
    win.id;


  rectEl.addEventListener(
    "click",
    evt => {

      evt.stopPropagation();

      if (
        mode === "select"
      ) {

        selectedWindowId =
          win.id;

        selectedRoomId =
          null;

        render();

      }

    }
  );


  const line =
    createSVG(
      "line",
      win.wall === "top" ||
      win.wall === "bottom"

      ? {

          x1: rect.x,
          y1: wallY,

          x2:
            rect.x +
            rect.width,

          y2: wallY,

          class:
            "window-line"

        }

      : {

          x1: wallX,
          y1: rect.y,

          x2: wallX,

          y2:
            rect.y +
            rect.height,

          class:
            "window-line"

        }
    );


  if (selected) {

    line.style.stroke =
      "#d35400";

  }


  windowLayer.appendChild(
    rectEl
  );

  windowLayer.appendChild(
    line
  );

}

  roomList.innerHTML = "";

        <input
          type="number"
          class="room-edit-w"
          value="${Math.round(room.w)}"
          min="${MIN_ROOM_SIZE}"
        >
        <span>×</span>
        <input
          type="number"
          class="room-edit-h"
          value="${Math.round(room.h)}"
          min="${MIN_ROOM_SIZE}"
        >
        <span>cm</span>

      </div>

    `;


    /* =========================
       點擊房間 → 選取
    ========================= */

    item.addEventListener(
      "click",
      () => {

        selectedRoomId =
          room.id;

        selectedWindowId =
          null;

        mode = "select";

        updateModeButtons();

        render();

      }
    );


    /* =========================
       房間名稱修改
    ========================= */

    const nameInput =
      item.querySelector(
        ".room-edit-name"
      );

    nameInput.addEventListener(
      "click",
      event => {
        event.stopPropagation();
      }
    );

    nameInput.addEventListener(
      "change",
      event => {

        room.name =
          event.target.value.trim() ||
          "未命名房間";

        render();

      }
    );


    /* =========================
       房間長度修改
    ========================= */

    const widthInput =
      item.querySelector(
        ".room-edit-w"
      );

    widthInput.addEventListener(
      "click",
      event => {
        event.stopPropagation();
      }
    );

    widthInput.addEventListener(
      "change",
      event => {

        let value =
          parseFloat(
            event.target.value
          );

        if (
          !Number.isFinite(value) ||
          value < MIN_ROOM_SIZE
        ) {
          value = MIN_ROOM_SIZE;
        }

        room.w = value;

        /* 不允許超出房屋 */
        room.w =
          Math.min(
            room.w,
            house.w
          );

        /* 保持房間在房屋內 */
        room.x = clamp(room.x, house.x, house.x + (house.w - room.w) * house.scale);

        render();

      }
    );


    /* =========================
       房間寬度修改
    ========================= */

    const heightInput =
      item.querySelector(
        ".room-edit-h"
      );

    heightInput.addEventListener(
      "click",
      event => {
        event.stopPropagation();
      }
    );

    heightInput.addEventListener(
      "change",
      event => {

        let value =
          parseFloat(
            event.target.value
          );

        if (
          !Number.isFinite(value) ||
          value < MIN_ROOM_SIZE
        ) {
          value = MIN_ROOM_SIZE;
        }

        room.h = value;

        /* 不允許超出房屋 */
        room.h =
          Math.min(
            room.h,
            house.h
          );

        /* 保持房間在房屋內 */
        room.y = clamp(room.y, house.y, house.y + (house.h - room.h) * house.scale);

        render();

      }
    );


    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "deleteBtn layer-del";
    delBtn.textContent = "刪除";
    delBtn.addEventListener("click", evt => {
      evt.stopPropagation();
      removeRoom(room.id);
    });
    item.appendChild(delBtn);

    roomList.appendChild(item);

  });

}


function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

let _prevSelRoom = null;
let _prevSelWin = null;

function render() {

  /* 清除已不存在房間上的門 */
  doors = doors.filter(d =>
    d.parentType === "house" ||
    rooms.some(r => r.id === d.parentId)
  );

  if (!doors.some(d => d.id === selectedDoorId)) {
    selectedDoorId = null;
  }

  /* 選到房間或窗戶時，取消門的選取 */
  if (
    (selectedRoomId && selectedRoomId !== _prevSelRoom) ||
    (selectedWindowId && selectedWindowId !== _prevSelWin)
  ) {
    selectedDoorId = null;
  }
  _prevSelRoom = selectedRoomId;
  _prevSelWin = selectedWindowId;


  renderHouse();

  renderRooms();

  /* 清除舊窗戶圖形 */
  windowLayer.innerHTML = "";

  renderWindowList();

  windows.forEach(renderWindow);

  doors.forEach(renderDoor);

  renderDoorList();

  updateLayerInfo();

  renderRoomList();

}

function updateModeButtons() {

  /* 進入繪製窗戶／門時，收起房屋／房間設定 */
  if (mode !== "select") activePanel = null;

  const $ = id => document.getElementById(id);

  $("toolHouse").classList.toggle("active", activePanel === "house");
  $("toolRoom").classList.toggle("active", activePanel === "room");
  $("windowModeTop").classList.toggle("active", mode === "window");
  $("doorModeTop").classList.toggle("active", mode === "door");

  /* 展開哪一排設定 */
  const show =
    mode === "window" ? "window" :
    mode === "door" ? "door" :
    activePanel;

  [
    ["house", "panelHouse"],
    ["room", "panelRoom"],
    ["window", "panelWindow"],
    ["door", "panelDoor"]
  ].forEach(([name, id]) => {
    $(id).classList.toggle("show", name === show);
  });

  $("toolPanel").style.display = show ? "flex" : "none";

  /* 離開某個模式時，清掉該模式的預覽 */

  if (mode !== "door") {
    previewDoor = null;
    windowLayer.querySelectorAll(".dpreview").forEach(el => el.remove());
  }

  if (mode !== "window") {
    previewWindow = null;
    windowLayer.querySelectorAll(".preview").forEach(el => el.remove());
  }

}
